<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Zen Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="root">
      <div class="timer">
        <div class="timer__time"></div>
        <button class="timer__start-button" autofocus z-index="1">Start</button>
        <button class="timer__stop-button">Stop</button>
        <button class="timer__reset-button">Reset</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
